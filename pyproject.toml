[project]
name = "torchamm"
description = "Scalable REML for additive smooth (penalized-spline) mixed models on PyTorch."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
# TODO: authors -- left blank; fill in once the contributor list is final
# (e.g. authors = [{ name = "...", email = "..." }, { name = "...", email = "..." }]).
keywords = ["mixed-models", "smoothing-splines", "REML", "pytorch", "GAMM", "variance-components"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "tqdm",
]
dynamic = ["version"]

[project.optional-dependencies]
examples = ["matplotlib", "jupyter"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/rrrrn/torchamm"
Repository = "https://github.com/rrrrn/torchamm"
Issues = "https://github.com/rrrrn/torchamm/issues"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "torchamm.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["torchamm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
